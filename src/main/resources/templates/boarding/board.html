<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('寄养看板')"></head>
<body>
<div class="layout">
  <aside th:replace="fragments/sidebar :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/header :: header"></header>
    <div class="content">
      <div th:replace="fragments/header :: flash"></div>
      <h1 class="page-title">寄养看板
        <a class="btn primary sm" href="/boarding/new">＋ 新建寄养</a>
      </h1>

      <div class="card mt16">
        <div class="card-body">
          <h2 class="sub">🏠 在住宠物（<span th:text="${#lists.size(inHouse)}"></span>）</h2>
          <table class="tbl">
            <thead><tr><th>单号</th><th>笼位</th><th>宠物</th><th>主人/电话</th><th>入住</th><th>预离店</th><th>已住</th><th></th></tr></thead>
            <tbody>
              <tr th:each="o : ${inHouse}" th:classappend="${o.overdue} ? 'row-red'">
                <td class="small" th:text="${o.orderNo}"></td>
                <td><span class="badge primary" th:text="${o.roomCode}"></span></td>
                <td><b th:text="${o.petName}"></b> <span class="muted small" th:text="${o.breed}"></span></td>
                <td><span th:text="${o.ownerName}"></span>
                    <a class="small" th:href="'tel:' + ${o.ownerPhone}" th:text="${o.ownerPhone}"></a></td>
                <td class="small" th:text="${ui.dt(o.startAt)}"></td>
                <td class="small" th:text="${o.plannedEndOn}"></td>
                <td><b th:text="${o.nightsSoFar()} + ' 晚'"></b>
                    <span class="badge danger" th:if="${o.overdue}"
                          th:text="'超期 ' + ${o.overdueDays()} + ' 天'"></span></td>
                <td><a class="btn ghost sm" th:href="@{/boarding/{id}(id=${o.id})}">详情 / 退住</a></td>
              </tr>
              <tr th:if="${#lists.isEmpty(inHouse)}"><td colspan="8" class="muted">当前没有在住宠物</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card mt16">
        <div class="card-body">
          <h2 class="sub">📥 今日应入住（<span th:text="${#lists.size(todayArrivals)}"></span>）</h2>
          <table class="tbl">
            <thead><tr><th>单号</th><th>笼位</th><th>宠物</th><th>主人/电话</th><th>计划入住</th><th>预离店</th><th></th></tr></thead>
            <tbody>
              <tr th:each="o : ${todayArrivals}">
                <td class="small" th:text="${o.orderNo}"></td>
                <td><span class="badge primary" th:text="${o.roomCode}"></span></td>
                <td><b th:text="${o.petName}"></b></td>
                <td><span th:text="${o.ownerName}"></span> <span class="small" th:text="${o.ownerPhone}"></span></td>
                <td class="small" th:text="${ui.dt(o.startAt)}"></td>
                <td class="small" th:text="${o.plannedEndOn}"></td>
                <td><a class="btn primary sm" th:href="@{/boarding/{id}(id=${o.id})}">办理入住</a></td>
              </tr>
              <tr th:if="${#lists.isEmpty(todayArrivals)}"><td colspan="7" class="muted">今日无计划入住</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card mt16">
        <div class="card-body">
          <h2 class="sub">📤 今日/已超期应离店（<span th:text="${#lists.size(todayDue)}"></span>）</h2>
          <table class="tbl">
            <thead><tr><th>单号</th><th>笼位</th><th>宠物</th><th>主人/电话</th><th>入住</th><th>预离店</th><th></th></tr></thead>
            <tbody>
              <tr th:each="o : ${todayDue}">
                <td class="small" th:text="${o.orderNo}"></td>
                <td><span class="badge primary" th:text="${o.roomCode}"></span></td>
                <td><b th:text="${o.petName}"></b></td>
                <td><span th:text="${o.ownerName}"></span> <span class="small" th:text="${o.ownerPhone}"></span></td>
                <td class="small" th:text="${ui.dt(o.startAt)}"></td>
                <td class="small" th:text="${o.plannedEndOn}"></td>
                <td><a class="btn primary sm" th:href="@{/boarding/{id}(id=${o.id})}">退住结算</a></td>
              </tr>
              <tr th:if="${#lists.isEmpty(todayDue)}"><td colspan="7" class="muted">无</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card mt16">
        <div class="card-body">
          <h2 class="sub">📋 历史寄养单</h2>
          <form class="toolbar" method="get" action="/boarding">
            <input type="hidden" name="view" value="history">
            <input class="input" type="text" name="keyword" placeholder="单号/客户/手机号/宠物名" th:value="${keyword}" style="width:180px">
            <input type="date" class="input" name="dateFrom" th:value="${dateFrom}">
            <span class="muted">至</span>
            <input type="date" class="input" name="dateTo" th:value="${dateTo}">
            <button class="btn ghost" type="submit">查询</button>
          </form>
          <th:block th:if="${view == 'history' and his != null}">
            <table class="tbl">
              <thead><tr><th>单号</th><th>宠物</th><th>主人</th><th>笼位</th><th>入住</th><th>退住</th><th>晚数</th><th>状态</th><th></th></tr></thead>
              <tbody>
                <tr th:each="o : ${his.rows}">
                  <td class="small" th:text="${o.orderNo}"></td>
                  <td th:text="${o.petName}"></td>
                  <td th:text="${o.ownerName}"></td>
                  <td th:text="${o.roomCode}"></td>
                  <td class="small" th:text="${ui.dt(o.startAt)}"></td>
                  <td class="small" th:text="${o.endAt != null} ? ${ui.dt(o.endAt)} : '—'"></td>
                  <td th:text="${o.days != null} ? ${o.days} + ' 晚' : '—'"></td>
                  <td><span class="badge" th:classappend="${o.status == 'CHECKED_IN'} ? 'primary' : (${o.status == 'CANCELLED'} ? 'danger' : 'ok')"
                            th:text="${ui.boardingStatus(o.status)}"></span></td>
                  <td><a class="btn ghost sm" th:href="@{/boarding/{id}(id=${o.id})}">详情</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(his.rows)}"><td colspan="9" class="muted">没有符合条件的寄养单</td></tr>
              </tbody>
            </table>
          </th:block>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
