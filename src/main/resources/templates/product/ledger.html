<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('库存流水')"></head>
<body>
<div class="layout">
  <aside th:replace="fragments/sidebar :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/header :: header"></header>
    <div class="content">
      <div th:replace="fragments/header :: flash"></div>
      <h1 class="page-title">库存流水 · <span th:text="${product.name}"></span>
        <span class="badge primary">当前库存 <span th:text="${product.stockQty}"></span></span>
      </h1>

      <div class="card">
        <div class="card-body">
          <form method="post" th:action="@{/products/{id}/stock(id=${product.id})}" class="inline-form">
            <select name="bizType">
              <option value="IN">采购入库</option>
              <option value="RETURN">退货入库</option>
              <option value="ADJUST">盘点调整（正数加 / 负数减）</option>
            </select>
            <input class="input" type="number" name="qty" required placeholder="数量（正负）" style="width:140px">
            <input class="input" type="text" name="remark" placeholder="原因备注（必填建议）" style="width:220px">
            <button class="btn" type="submit" onclick="this.disabled=true;this.form.submit()">提交变动</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-body flush">
          <table class="tbl">
            <thead><tr><th>时间</th><th>类型</th><th class="num">变动</th><th class="num">变动前</th><th class="num">变动后</th><th>关联</th><th>操作人</th><th>备注</th></tr></thead>
            <tbody>
              <tr th:each="l : ${logs}">
                <td class="small" th:text="${ui.dt(l.createdAt)}"></td>
                <td><span class="badge" th:classappend="${l.qtyChange > 0} ? 'ok' : 'danger'" th:text="${ui.ledgerType(l.bizType)}"></span></td>
                <td class="num"><b th:text="${l.qtyChange > 0} ? '+' + ${l.qtyChange} : ${l.qtyChange}"></b></td>
                <td class="num" th:text="${l.beforeQty}"></td>
                <td class="num" th:text="${l.afterQty}"></td>
                <td><a th:if="${l.refType == 'BILL'}" th:href="@{/bills/{id}(id=${l.refId})}" th:text="'单 #' + ${l.refId}"></a>
                    <span th:if="${l.refType == 'MANUAL'}" class="muted small">手工</span></td>
                <td class="small" th:text="${l.operator}"></td>
                <td class="small muted" th:text="${l.remark} ?: '—'"></td>
              </tr>
              <tr th:if="${#lists.isEmpty(logs)}"><td colspan="8" class="muted">还没有流水</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <p class="small muted">流水只允许新增，不允许修改与删除；库存结存 = 流水求和。</p>
    </div>
  </div>
</div>
</body>
</html>
