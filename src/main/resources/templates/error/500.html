<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('系统错误')"></head>
<body>
<div class="login-wrap">
  <div class="login-box" style="text-align:center">
    <div class="logo-big">😖</div>
    <h1>系统出错了</h1>
    <p class="muted" th:text="${errMsg} ?: '请稍后重试；若持续出现请联系维护人员，并提供 logs/error.log'"></p>
    <a class="btn lg" th:href="@{/}">返回首页</a>
  </div>
</div>
</body>
</html>
