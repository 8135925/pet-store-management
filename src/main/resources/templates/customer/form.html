<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('客户建档')"></head>
<body>
<div class="layout">
  <aside th:replace="fragments/sidebar :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/header :: header"></header>
    <div class="content">
      <div th:replace="fragments/header :: flash"></div>
      <div class="toolbar" style="margin-bottom:8px">
        <button type="button" class="btn ghost sm" data-back="/customers"><i data-lucide="arrow-left"></i> 返回客户档案</button>
      </div>
      <h1 class="page-title" th:text="${customer.id == null} ? '客户建档' : '编辑客户'"></h1>

      <div class="card">
        <div class="card-body">
          <form method="post" th:action="@{/customers/save}">
            <input type="hidden" name="id" th:value="${customer.id}">
            <div class="form-grid">
              <div class="field">
                <label>姓名（或称呼）*</label>
                <input type="text" name="name" required maxlength="20" th:value="${customer.name}">
              </div>
              <div class="field">
                <label>手机号 *</label>
                <input type="text" name="phone" required maxlength="11" pattern="\d{11}" title="11 位手机号" th:value="${customer.phone}">
                <div class="hint">手机号是客户唯一标识，重复会被拒绝</div>
              </div>
              <div class="field">
                <label>来源渠道</label>
                <select name="source">
                  <option value="">—</option>
                  <option value="自然到店" th:selected="${customer.source == '自然到店'}">自然到店</option>
                  <option value="朋友介绍" th:selected="${customer.source == '朋友介绍'}">朋友介绍</option>
                  <option value="美团" th:selected="${customer.source == '美团'}">美团</option>
                  <option value="抖音" th:selected="${customer.source == '抖音'}">抖音</option>
                  <option value="小区住户" th:selected="${customer.source == '小区住户'}">小区住户</option>
                  <option value="其他" th:selected="${customer.source == '其他'}">其他</option>
                </select>
              </div>
              <div class="field full">
                <label>备注（住址、习惯、投诉历史等）</label>
                <textarea name="remark" rows="3" th:text="${customer.remark}"></textarea>
              </div>
            </div>
            <div class="flex mt16">
              <button class="btn lg" type="submit">保存</button>
              <a class="btn ghost lg" th:href="${customer.id == null} ? @{/customers} : @{/customers/{id}(id=${customer.id})}">取消</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
